<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>浚鍵管理有限公司｜西鐵小巴每月營運收支計算系統</title>
<!-- Firebase 9.3.0 UMD，今次補埋 auth 登入模組 -->
<script src="https://www.gstatic.com/firebasejs/9.3.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.3.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.3.0/firebase-database.js"></script>
<style>
*{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Noto Sans HK,sans-serif;margin:0;padding:0;}

:root{
  --bg:#f0f2f5;
  --card:#ffffff;
  --text:#1f2937;
  --text-secondary:#666666;
  --border:#cbd5e1;
  --income-bg:#dcfce7;
  --income-text:#065f46;
  --exp-bg:#fee2e2;
  --exp-text:#991b1b;
}

body.dark{
  --bg:#121212;
  --card:#1e1e1e;
  --text:#f1f1f1;
  --text-secondary:#aaaaaa;
  --border:#444444;
  --income-bg:#133b28;
  --income-text:#86efac;
  --exp-bg:#421818;
  --exp-text:#fca5a5;
}

body{
  background:var(--bg);
  color:var(--text);
  padding:12px;
  font-size:16px;
  max-width:720px;
  margin:0 auto;
  transition: background 0.3s, color 0.3s;
}
.card{
  background:var(--card);
  border-radius:12px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 1px 4px #00000018;
}
h2{font-size:18px;margin-bottom:12px;color:var(--text);border-left:4px solid #2563eb;padding-left:8px;}
.row{display:grid;gap:10px;margin-bottom:10px;}
input{
  width:100%;
  padding:11px 12px;
  border:1px solid var(--border);
  border-radius:8px;
  font-size:16px;
  background:var(--card);
  color:var(--text);
}
input:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 2px #2563eb33;}
.btn{padding:11px 14px;border:none;border-radius:8px;font-size:16px;font-weight:500;cursor:pointer;}
.btn-primary{background:#2563eb;color:white;}
.btn-success{background:#059669;color:white;}
.btn-warning{background:#d97706;color:white;}
.btn-google{background:#4285f4;color:white;}
.btn-theme{background:#6366f1;color:white;width:100%;margin-bottom:8px;}

.sum-box{padding:14px;border-radius:10px;margin-top:10px;font-weight:bold;font-size:17px;}
.income-box{background:var(--income-bg);color:var(--income-text);}
.exp-box{background:var(--exp-bg);color:var(--exp-text);}
.profit-positive{background:var(--income-bg);color:var(--income-text);}
.profit-negative{background:var(--exp-bg);color:var(--exp-text);}

.month-selector{display:flex;gap:8px;margin-bottom:12px;}
.month-selector input{flex:1;}
.history-item{padding:10px;border-bottom:1px solid var(--border);cursor:pointer;color:var(--text);}
.status-tip{font-size:14px;margin-bottom:8px;}

/* 登入遮罩區域 */
#loginWrap{
  text-align:center;
  padding:40px 20px;
}
#mainApp{
  display:none;
}
.user-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}
</style>
</head>
<body>

<div id="loginWrap">
  <h1>浚鍵管理有限公司</h1>
  <p style="margin:20px 0;">西鐵小巴每月營運收支計算系統</p>
  <p class="status-tip" id="fbLoginStatus">🔄 初始化 Firebase...</p>
  <br>
  <button class="btn btn-google" onclick="signInGoogle()">🔐 Google帳號登入</button>
</div>

<div id="mainApp">
  <div class="user-bar">
    <span id="userInfo"></span>
    <button class="btn btn-warning" onclick="signOut()">🚪 登出</button>
  </div>

  <div class="card">
    <div class="status-tip" id="fbStatus">🔄 Firebase 連接中...</div>
    <button class="btn btn-theme" onclick="toggleTheme()">🌓 切換 淺色 / 新制(深色)模式</button>
  </div>

  <div class="card">
    <h2>📅 選擇月份</h2>
    <div class="month-selector">
      <input type="month" id="selMonth">
      <button class="btn btn-primary" onclick="loadMonthData()">載入月份數據</button>
    </div>
  </div>

  <div class="card">
    <h2>💰 收入項目</h2>
    <div class="row">
      <label>早間司機收入</label>
      <input type="number" id="inMorning" placeholder="輸入金額" oninput="calcAll()">
    </div>
    <div class="row">
      <label>夜間司機收入</label>
      <input type="number" id="inNight" placeholder="輸入金額" oninput="calcAll()">
    </div>
    <div class="row">
      <label>特間(全間)司機收入</label>
      <input type="number" id="inSpecial" placeholder="輸入金額" oninput="calcAll()">
    </div>
    <div class="row">
      <label>八達通收款</label>
      <input type="number" id="inOctopus" placeholder="輸入金額" oninput="calcAll()">
    </div>
    <div class="row">
      <label>現金收款</label>
      <input type="number" id="inCash" placeholder="輸入金額" oninput="calcAll()">
    </div>
    <div class="sum-box income-box">
      收入小計：HK$ <span id="subIncome">0.00</span>
    </div>
  </div>

  <div class="card">
    <h2>💸 支出項目</h2>
    <div class="row">
      <label>燃料費(石油氣)</label>
      <input type="number" id="outFuel" placeholder="輸入金額" oninput="calcAll()">
    </div>
    <div class="row">
      <label>車租</label>
      <input type="number" id="outRent" placeholder="輸入金額" oninput="calcAll()">
    </div>
    <div class="row">
      <label>維修保養費</label>
      <input type="number" id="outRepair" placeholder="輸入金額" oninput="calcAll()">
    </div>
    <div class="row">
      <label>保險及牌費</label>
      <input type="number" id="outInsLicense" placeholder="輸入金額" oninput="calcAll()">
    </div>
    <div class="row">
      <label>違例告票罰款</label>
      <input type="number" id="outTicket" placeholder="輸入告票罰款總額" oninput="calcAll()">
    </div>
    <div class="row">
      <label>其他雜項支出</label>
      <input type="number" id="outOther" placeholder="輸入金額" oninput="calcAll()">
    </div>
    <div class="sum-box exp-box">
      支出小計：HK$ <span id="subExpense">0.00</span>
    </div>
  </div>

  <div class="card">
    <h2>📊 每月營運總結</h2>
    <div class="row">
      <div>總收入：HK$ <strong id="totalIncome">0.00</strong></div>
      <div>總支出：HK$ <strong id="totalExpense">0.00</strong></div>
    </div>
    <div id="netBox" class="sum-box profit-positive">
      淨盈虧：HK$ <span id="netProfit">0.00</span>
    </div>
    <div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <button class="btn btn-success" onclick="saveCurrent()">💾 儲存本月數據</button>
      <button class="btn btn-warning" onclick="exportCSV()">📤 匯出CSV檔案</button>
    </div>
  </div>

  <div class="card">
    <h2>📜 歷史月份記錄</h2>
    <div id="historyList"></div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA2t2wqnJX8orbm99cfKW1BXb8yI6ZJdv8",
  authDomain: "minibus-operation-system.firebaseapp.com",
  projectId: "minibus-operation-system",
  storageBucket: "minibus-operation-system.firebasestorage.app",
  messagingSenderId: "744623977021",
  appId: "1:744623977021:web:36dc766e42d2681c9e7054",
  measurementId: "G-Q68FT09T7Q"
};

let app, auth, db;
let firebaseReady = false;
const fbStatusEl = document.getElementById("fbStatus");
const fbLoginStatusEl = document.getElementById("fbLoginStatus");
const loginWrap = document.getElementById("loginWrap");
const mainApp = document.getElementById("mainApp");
const userInfoEl = document.getElementById("userInfo");

// 主題
function applyTheme(isDark){
  isDark ? document.body.classList.add("dark") : document.body.classList.remove("dark");
  localStorage.setItem("minibusTheme", isDark?"dark":"light");
}
function toggleTheme(){
  applyTheme(!document.body.classList.contains("dark"));
}
(function loadTheme(){
  const saved = localStorage.getItem("minibusTheme");
  applyTheme(saved === "dark");
})();

// 預設月份
const now=new Date();
document.getElementById('selMonth').value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

// 讀取表單數據
function getPageValues(){
  return {
    inMorning:Number(document.getElementById('inMorning').value||0),
    inNight:Number(document.getElementById('inNight').value||0),
    inSpecial:Number(document.getElementById('inSpecial').value||0),
    inOctopus:Number(document.getElementById('inOctopus').value||0),
    inCash:Number(document.getElementById('inCash').value||0),

    outFuel:Number(document.getElementById('outFuel').value||0),
    outRent:Number(document.getElementById('outRent').value||0),
    outRepair:Number(document.getElementById('outRepair').value||0),
    outInsLicense:Number(document.getElementById('outInsLicense').value||0),
    outTicket:Number(document.getElementById('outTicket').value||0),
    outOther:Number(document.getElementById('outOther').value||0),
  }
}

// 計算
function calcAll(){
  const d=getPageValues();
  const subIncome = d.inMorning + d.inNight + d.inSpecial + d.inOctopus + d.inCash;
  const subExpense = d.outFuel + d.outRent + d.outRepair + d.outInsLicense + d.outTicket + d.outOther;
  const net = subIncome - subExpense;

  document.getElementById('subIncome').textContent=subIncome.toFixed(2);
  document.getElementById('subExpense').textContent=subExpense.toFixed(2);
  document.getElementById('totalIncome').textContent=subIncome.toFixed(2);
  document.getElementById('totalExpense').textContent=subExpense.toFixed(2);
  document.getElementById('netProfit').textContent=net.toFixed(2);

  const netBox=document.getElementById('netBox');
  netBox.className = net >=0 ? "sum-box profit-positive" : "sum-box profit-negative";
}

// LocalStorage本機備份
const LOCAL_KEY = "minibusAccountsLocal";
function localGetAll(){
  const raw = localStorage.getItem(LOCAL_KEY);
  return raw ? JSON.parse(raw) : {};
}
function localSaveMonth(monthKey,data){
  const all = localGetAll();
  all[monthKey]=data;
  localStorage.setItem(LOCAL_KEY,JSON.stringify(all));
}
function localLoadMonth(monthKey){
  const all = localGetAll();
  return all[monthKey] || {
    inMorning:0,inNight:0,inSpecial:0,inOctopus:0,inCash:0,
    outFuel:0,outRent:0,outRepair:0,outInsLicense:0,outTicket:0,outOther:0
  };
}

// ========= Firebase 初始化 + Google登入 =========
if(typeof firebase !== "undefined"){
  app = firebase.initializeApp(firebaseConfig);
  auth = firebase.auth(app);
  db = firebase.database(app);
  fbLoginStatusEl.textContent="✅ Firebase載入完成，等待登入狀態";

  // 監測登入狀態
  auth.onAuthStateChanged(user=>{
    if(user){
      // 已登入，切換到主介面
      loginWrap.style.display="none";
      mainApp.style.display="block";
      userInfoEl.textContent = `👤 ${user.displayName} (${user.email})`;
      firebaseReady = true;
      fbStatusEl.textContent="✅ 已登入，Firebase雲端已連接";
      loadMonthData();
    }else{
      // 未登入，顯示登入頁
      loginWrap.style.display="block";
      mainApp.style.display="none";
      firebaseReady = false;
      fbLoginStatusEl.textContent="⚠️ 尚未登入，請使用Google帳號登入";
    }
  });

}else{
  fbLoginStatusEl.textContent="❌ Firebase SDK載入失敗，無法雲端登入，只可用本機模式";
}

// Google彈窗登入
async function signInGoogle(){
  const provider = new firebase.auth.GoogleAuthProvider();
  try{
    await auth.signInWithPopup(provider);
  }catch(err){
    alert("登入失敗："+err.message);
  }
}

// 登出
async function signOut(){
  try{
    await auth.signOut();
  }catch(e){
    alert("登出異常："+e.message);
  }
}

// 載入月份數據
async function loadMonthData(){
  const monthKey=document.getElementById('selMonth').value;
  let d;
  if(firebaseReady){
    try{
      const snapshot = await db.ref("minibusAccounts").child(monthKey).get();
      d = snapshot.exists() ? snapshot.val() : localLoadMonth(monthKey);
    }catch(e){
      alert("雲端讀取失敗，讀取本機數據："+e.message);
      d = localLoadMonth(monthKey);
    }
  }else{
    d = localLoadMonth(monthKey);
  }

  document.getElementById('inMorning').value=d.inMorning||'';
  document.getElementById('inNight').value=d.inNight||'';
  document.getElementById('inSpecial').value=d.inSpecial||'';
  document.getElementById('inOctopus').value=d.inOctopus||'';
  document.getElementById('inCash').value=d.inCash||'';

  document.getElementById('outFuel').value=d.outFuel||'';
  document.getElementById('outRent').value=d.outRent||'';
  document.getElementById('outRepair').value=d.outRepair||'';
  document.getElementById('outInsLicense').value=d.outInsLicense||'';
  document.getElementById('outTicket').value=d.outTicket||'';
  document.getElementById('outOther').value=d.outOther||'';
  calcAll();
  renderHistory();
}

// 儲存
async function saveCurrent(){
  const monthKey=document.getElementById('selMonth').value;
  const payload = getPageValues();
  localSaveMonth(monthKey,payload);
  if(firebaseReady){
    try{
      await db.ref("minibusAccounts").child(monthKey).set(payload);
      alert("✅ 已儲存至雲端 + 本機備份");
    }catch(err){
      alert("⚠️ 雲端儲存失敗，但已保存本機："+err.message);
    }
  }else{
    alert("✅ 僅儲存至本機（未登入）");
  }
  renderHistory();
}

// 渲染歷史記錄
async function renderHistory(){
  const listDom=document.getElementById('historyList');
  listDom.innerHTML="讀取中...";
  let cloudData = {};
  if(firebaseReady){
    try{
      const snap = await db.ref("minibusAccounts").get();
      cloudData = snap.val()||{};
    }catch(e){}
  }
  const localData = localGetAll();
  const merged = {...localData,...cloudData};
  listDom.innerHTML="";
  const keys=Object.keys(merged).sort().reverse();
  if(keys.length===0){
    listDom.innerHTML="<div style='color:var(--text-secondary)'>暫無記錄</div>";
    return;
  }
  keys.forEach(k=>{
    const d=merged[k];
    const inc = d.inMorning+d.inNight+d.inSpecial+d.inOctopus+d.inCash;
    const exp = d.outFuel+d.outRent+d.outRepair+d.outInsLicense+d.outTicket+d.outOther;
    const net = inc-exp;
    const div=document.createElement('div');
    div.className="history-item";
    div.innerHTML=`${k}｜收入:${inc.toFixed(2)}｜支出:${exp.toFixed(2)}｜淨:${net.toFixed(2)}`;
    div.onclick=()=>{
      document.getElementById('selMonth').value=k;
      loadMonthData();
    }
    listDom.appendChild(div);
  })
}

// 匯出CSV
async function exportCSV(){
  let cloudData = {};
  if(firebaseReady){
    try{
      const snap = await db.ref("minibusAccounts").get();
      cloudData = snap.val()||{};
    }catch(e){}
  }
  const localData = localGetAll();
  const all = {...localData,...cloudData};

  const header=[
    "月份",
    "早間司機收入","夜間司機收入","特間司機收入","八達通收款","現金收款",
    "燃料費","車租","維修保養","保險牌費","違例告票罰款","其他雜項",
    "總收入","總支出","淨盈虧"
  ];
  const rows=[];
  rows.push(header.join(","));
  Object.keys(all).sort().forEach(k=>{
    const d=all[k];
    const inc = d.inMorning+d.inNight+d.inSpecial+d.inOctopus+d.inCash;
    const exp = d.outFuel+d.outRent+d.outRepair+d.outInsLicense+d.outTicket+d.outOther;
    const net = inc-exp;
    const line=[
      k,
      d.inMorning,d.inNight,d.inSpecial,d.inOctopus,d.inCash,
      d.outFuel,d.outRent,d.outRepair,d.outInsLicense,d.outTicket,d.outOther,
      inc.toFixed(2),exp.toFixed(2),net.toFixed(2)
    ];
    rows.push(line.join(","));
  })
  const csvContent = "\uFEFF"+rows.join("\n");
  const blob=new Blob([csvContent],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="浚鍵管理有限公司_西鐵小巴營運帳目.csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
